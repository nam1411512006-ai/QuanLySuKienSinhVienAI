services:

  db:
    image: mysql:8.4
    container_name: quanlysu-kien-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: QuanLySuKienSinhVien

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/QuanLySuKienSinhVienAI.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: quanlysu-kien-backend
    restart: unless-stopped

    environment:
      APP_NAME: "QuanLySuKienSinhVienAI API"
      APP_ENV: development
      DEBUG: "true"

      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: QuanLySuKienSinhVien
      DATABASE_USER: root
      DATABASE_PASSWORD: root

      JWT_SECRET_KEY: dev-secret-change-before-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120

      BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"

    ports:
      - "8000:8000"

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: quanly-su-kien-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  mysql_data:
