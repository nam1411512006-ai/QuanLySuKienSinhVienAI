name: QuanLySuKienSinhVienAI CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React application
        run: npm run build


  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:
    name: Backend - MariaDB & Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:

      mariadb:
        image: mariadb:10.4

        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: QuanLySuKienSinhVien

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install MariaDB client
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Prepare MariaDB database
        working-directory: .
        run: |
          mariadb \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            -e "CREATE DATABASE IF NOT EXISTS QuanLySuKienSinhVien CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

          mariadb \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            QuanLySuKienSinhVien \
            < "database/QuanLySuKienSinhVienAI.sql"

      - name: Check MariaDB database
        working-directory: .
        run: |
          mariadb \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            -e "USE QuanLySuKienSinhVien; SHOW TABLES;"

      - name: Check FastAPI application
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: QuanLySuKienSinhVien
          DATABASE_USER: root
          DATABASE_PASSWORD: root
          JWT_SECRET_KEY: ci-test-secret-key
          APP_NAME: QuanLySuKienSinhVienAI
          APP_ENV: testing
          DEBUG: "false"

        run: |
          python -c "from app.main import app; print('FastAPI application import: OK')"

      - name: Run backend tests with coverage
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: QuanLySuKienSinhVien
          DATABASE_USER: root
          DATABASE_PASSWORD: root
          JWT_SECRET_KEY: ci-test-secret-key
          APP_NAME: QuanLySuKienSinhVienAI
          APP_ENV: testing
          DEBUG: "false"

        run: |
          python -m pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml


  # ==========================================================
  # DOCKER BUILD
  # ==========================================================

  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: quanlysu-kien-backend:ci

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://localhost:8000
          tags: quanlysu-kien-frontend:ci